<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تخمييييين اللاعب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07140F; --bg-1:#0B2018; --bg-2:#0F2B21;
    --cream:#F1EDE0; --gold:#E4B73B; --red:#C4453C; --green:#3CA35A;
    --blue:#3C7DC4; --yellow:#F2C230; --card-bg:#12261D; --card-bg-2:#0d1e16;
    --muted:#9fb3a6; --shadow: 0 10px 30px rgba(0,0,0,.45); --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; font-family:'Tajawal', sans-serif; color:var(--cream);
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(228,183,59,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(60,163,90,.14), transparent 55%),
      repeating-linear-gradient(0deg, var(--bg-1) 0 46px, var(--bg-2) 46px 92px),
      var(--bg-0);
    background-attachment:fixed; position:relative; overflow-x:hidden;
  }
  #app{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:18px 16px 60px;}
  h1,h2,h3{font-family:'Cairo', sans-serif; margin:0;}
  .eyebrow{font-family:'Oswald', sans-serif; font-weight:600; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); direction:ltr; text-align:center;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 2px 22px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .crest{width:38px; height:38px; border-radius:50%; background:conic-gradient(from 180deg, var(--gold), var(--green), var(--gold)); display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow: var(--shadow);}
  .brand-name{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px;}
  .players-home-btn{position:absolute;top:18px;left:18px;z-index:10;background:rgba(241,237,224,.08);border:1px solid rgba(241,237,224,.18);color:var(--cream);padding:9px 15px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;transition:.2s ease}.players-home-btn:hover{background:rgba(241,237,224,.14);transform:translateY(-1px)}
.home-btn{background:rgba(241,237,224,.08); border:1px solid rgba(241,237,224,.18); color:var(--cream); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;}
  .home-btn:hover{background:rgba(241,237,224,.14);}
  .back-btn{background:rgba(241,237,224,.08); border:1px solid rgba(241,237,224,.18); color:var(--cream); padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;}
  .back-btn:hover{background:rgba(241,237,224,.14);}
  .top-actions{display:flex;gap:8px;align-items:center;}

  .screen{animation: fadeUp .35s ease both;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  .hero{text-align:center; padding: 28px 10px 8px;}
  .hero h1{font-size:44px; font-weight:900; background:linear-gradient(180deg, var(--cream), var(--gold) 130%); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.15;}
  .hero p{color:var(--muted); font-size:15px; margin-top:10px; max-width:520px; margin-inline:auto;}

  .stamp-line{display:flex; align-items:center; gap:12px; margin:26px 0 18px;}
  .stamp-line::before, .stamp-line::after{content:""; height:1px; flex:1; background:linear-gradient(90deg, transparent, rgba(241,237,224,.25), transparent);}
  .stamp-line span{font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:2px; color:var(--muted); white-space:nowrap;}

  .phase-grid{display:grid; grid-template-columns:1fr; gap:14px; margin-top:6px;}
  .phase-card{position:relative; background:linear-gradient(160deg, var(--card-bg), var(--card-bg-2)); border:1px solid rgba(241,237,224,.12); border-radius:var(--radius); padding:20px 20px 18px; box-shadow:var(--shadow); cursor:pointer; overflow:hidden; transition: transform .15s ease, border-color .15s ease;}
  .phase-card:hover{transform:translateY(-2px); border-color:rgba(228,183,59,.5);}
  .phase-card.locked{cursor:not-allowed; opacity:.55;}
  .phase-card.locked:hover{transform:none; border-color:rgba(241,237,224,.12);}
  .phase-card .num{font-family:'Oswald',sans-serif; font-size:13px; color:var(--gold); letter-spacing:2px;}
  .phase-card h3{font-size:21px; margin-top:4px;}
  .phase-card p{color:var(--muted); font-size:13.5px; margin-top:6px; line-height:1.7;}
  .lock-badge{position:absolute; left:16px; top:16px; background:rgba(0,0,0,.4); border:1px solid rgba(241,237,224,.2); padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;}
  .stripe{position:absolute; inset-inline-start:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:radial-gradient(circle, rgba(228,183,59,.18), transparent 65%);}

  .btn{font-family:'Tajawal', sans-serif; font-weight:800; font-size:15px; border:none; cursor:pointer; border-radius:14px; padding:13px 22px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .1s ease, filter .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(180deg, var(--gold), #caa02e); color:#241c05; box-shadow:0 8px 20px rgba(228,183,59,.25);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:rgba(241,237,224,.08); color:var(--cream); border:1px solid rgba(241,237,224,.18);}
  .btn-ghost:hover{background:rgba(241,237,224,.14);}
  .btn-hint{background:rgba(60,163,90,.16); color:var(--cream); border:1px solid rgba(60,163,90,.4);}
  .btn-hint:hover{background:rgba(60,163,90,.26);}
  .btn-block{width:100%;}
  .btn-lg{padding:16px 22px; font-size:16px; border-radius:16px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:700;}
  .field input, .field select{width:100%; padding:13px 14px; border-radius:12px; border:1px solid rgba(241,237,224,.18); background:rgba(7,20,15,.55); color:var(--cream); font-family:'Tajawal',sans-serif; font-size:15px; outline:none;}
  .field input:focus, .field select:focus{border-color:var(--gold);}
  .panel{background:linear-gradient(160deg, var(--card-bg), var(--card-bg-2)); border:1px solid rgba(241,237,224,.12); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);}
  .panel h2{font-size:20px; margin-bottom:16px;}
  .seg{display:flex; gap:8px; background:rgba(0,0,0,.25); padding:5px; border-radius:14px;}
  .seg button{flex:1; padding:10px; border:none; background:transparent; color:var(--muted); font-family:'Tajawal',sans-serif; font-weight:800; border-radius:10px; cursor:pointer; font-size:13.5px;}
  .seg button.active{background:var(--gold); color:#241c05;}

  .scoreboard{display:flex; align-items:center; justify-content:space-between; background:linear-gradient(160deg, #0d1f17, #0a1a13); border:1px solid rgba(241,237,224,.14); border-radius:16px; padding:14px 18px; margin-bottom:18px; box-shadow: var(--shadow);}
  .sb-side{text-align:center; flex:1;}
  .sb-name{font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .sb-score{font-family:'Oswald',sans-serif; font-size:30px; font-weight:700; direction:ltr;}
  .sb-mid{text-align:center; padding:0 14px;}
  .sb-round{font-size:11px; color:var(--gold); letter-spacing:2px; font-family:'Oswald',sans-serif;}
  .sb-vs{font-size:11px; color:var(--muted); margin-top:2px;}
  .turn-flag{color:var(--gold);}

  .cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; margin-top:6px;}
  .pcard{position:relative; background:linear-gradient(160deg, #16301f, #0e2118); border:1px solid rgba(241,237,224,.14); border-radius:16px; padding:12px 10px 14px; text-align:center; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, filter .2s ease; box-shadow: 0 6px 16px rgba(0,0,0,.35);}
  .pcard:hover:not(.pcard-disabled){transform:translateY(-4px); border-color:rgba(228,183,59,.55);}
  .pcard-disabled{cursor:default; opacity:.55;}
  .pcard-disabled.pcard-correct{opacity:1;}
  .pcard-selected{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 10px 22px rgba(228,183,59,.25);}
  .pcard-correct{border-color:var(--green); box-shadow:0 0 0 2px var(--green), 0 10px 22px rgba(60,163,90,.3);}
  .pcard .badges{display:flex; justify-content:space-between; margin-bottom:8px;}
  .pcard .pos-pill{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px; color:#0b0b0b;}
  .pcard .num{font-family:'Oswald',sans-serif; font-size:12px; color:var(--muted);}
  .avatar{width:64px; height:64px; margin:2px auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Cairo',sans-serif; font-weight:900; font-size:24px; color:#0b0b0b; box-shadow: inset 0 -6px 10px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.35); position:relative;}
  .avatar .flag{position:absolute; bottom:-4px; left:-4px; background:#0b0b0b; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px; border:2px solid var(--bg-1);}
  .pcard .pname{font-weight:800; font-size:13.5px; line-height:1.3;}
  .pcard .pteam{font-size:11px; color:var(--muted); margin-top:2px;}
  .pcard .pnat{font-size:10.5px; color:var(--muted); margin-top:1px;}
  .stamp{position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-14deg); border:3px solid var(--gold); color:var(--gold); font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; padding:4px 12px; border-radius:8px; font-size:13px; background:rgba(7,20,15,.55); opacity:0; animation: stampIn .5s ease forwards;}
  @keyframes stampIn{ 0%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(1.6);} 60%{opacity:1;} 100%{opacity:1; transform:translate(-50%,-50%) rotate(-14deg) scale(1);} }
  .check-badge{position:absolute; top:8px; left:8px; background:var(--green); color:#06170d; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px;}

  .pass-screen{text-align:center; padding:60px 20px;}
  .pass-icon{font-size:56px; margin-bottom:14px;}
  .pass-screen h2{font-size:24px; margin-bottom:8px;}
  .pass-screen p{color:var(--muted); font-size:14px; margin-bottom:26px;}

  .result-banner{text-align:center; padding:22px 16px; border-radius:16px; margin-bottom:18px; border:1px solid rgba(241,237,224,.14);}
  .result-banner.win{background:linear-gradient(160deg, rgba(60,163,90,.18), rgba(60,163,90,.05));}
  .result-banner h2{font-size:26px;}
  .result-banner .points{font-family:'Oswald',sans-serif; color:var(--gold); font-size:20px; margin-top:6px;}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:#151f19; border:1px solid rgba(241,237,224,.2); color:var(--cream); padding:12px 20px; border-radius:12px; font-size:14px; font-weight:700; box-shadow: var(--shadow); z-index:50; opacity:0; transition: all .25s ease; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .small-muted{color:var(--muted); font-size:12.5px;}
  .center{text-align:center;}
  .mt{margin-top:16px;}
  .final-podium{display:flex; justify-content:center; gap:14px; margin:24px 0;}
  .podium-card{background:linear-gradient(160deg, var(--card-bg), var(--card-bg-2)); border:1px solid rgba(228,183,59,.3); border-radius:16px; padding:18px 22px; text-align:center; min-width:130px;}
  .podium-card .trophy{font-size:30px;}
  .podium-card .pname{font-weight:800; margin-top:6px;}
  .podium-card .pscore{font-family:'Oswald',sans-serif; color:var(--gold); font-size:22px; margin-top:4px;}

  .qa-wrap{background:linear-gradient(160deg, var(--card-bg), var(--card-bg-2)); border:1px solid rgba(241,237,224,.14); border-radius:18px; padding:18px; box-shadow:var(--shadow);}
  .qa-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:6px;}
  .qa-potential{font-family:'Oswald',sans-serif; color:var(--gold); font-size:13.5px;}
  .qa-log{max-height:200px; overflow-y:auto; margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
  .qa-entry{background:rgba(255,255,255,.04); border:1px solid rgba(241,237,224,.1); border-radius:10px; padding:8px 12px; font-size:13px;}
  .qa-entry b{color:var(--gold);}
  .guess-row{display:flex; gap:8px; margin-top:6px;}
  .guess-row input{flex:1;}
  .wrong-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .wrong-chip{background:rgba(196,69,60,.14); border:1px solid rgba(196,69,60,.4); color:var(--cream); padding:5px 10px; border-radius:999px; font-size:11.5px;}
  .waiting-block{text-align:center; padding:26px 10px;}
  .ai-pulse{display:inline-flex; gap:5px; margin-top:8px;}
  .ai-pulse span{width:7px; height:7px; border-radius:50%; background:var(--gold); animation:pulse 1.1s ease-in-out infinite;}
  .ai-pulse span:nth-child(2){animation-delay:.15s;}
  .ai-pulse span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{ 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:1; transform:scale(1.15);} }

  .question-bubble{background:rgba(228,183,59,.12); border:1px solid rgba(228,183,59,.4); border-radius:16px; padding:18px; text-align:center; font-size:17px; font-weight:800; margin:16px 0;}
  .answer-buttons{display:flex; gap:14px; justify-content:center; margin-top:10px;}
  .yesno-btn{flex:1; max-width:160px; padding:18px; border-radius:16px; font-size:19px; font-weight:900; border:none; cursor:pointer; font-family:'Tajawal',sans-serif;}
  .yesno-yes{background:linear-gradient(180deg,var(--green),#2c7a44); color:#06170d;}
  .yesno-no{background:linear-gradient(180deg,var(--red),#8f342c); color:#fff;}

  .radar{width:120px; height:120px; margin:10px auto 20px; border-radius:50%; border:2px solid rgba(228,183,59,.35); position:relative; overflow:hidden; background:radial-gradient(circle, rgba(228,183,59,.08), transparent 70%);}
  .radar::before{content:""; position:absolute; inset:0; background:conic-gradient(from 0deg, rgba(228,183,59,.55), transparent 35%); animation:spin 1.6s linear infinite;}
  .radar::after{content:"⚽"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px;}
  @keyframes spin{ to{transform:rotate(360deg);} }

  .room-code{font-family:'Oswald',sans-serif; font-size:38px; letter-spacing:10px; text-align:center; color:var(--gold); direction:ltr; margin:14px 0; font-weight:700;}
  .copy-row{display:flex; justify-content:center; gap:10px; margin-bottom:6px;}

  .players-tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;}
  .players-tools input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(241,237,224,.18);background:rgba(7,20,15,.55);color:var(--cream);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;}
  .players-tools input:focus{border-color:var(--gold);}
  .players-count{color:var(--muted);font-size:12px;white-space:nowrap;}
  .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
  .players-page-title{text-align:center;margin-bottom:18px;}
  .players-page-title h2{font-size:26px;}
  .players-page-title p{color:var(--muted);font-size:13px;margin-top:5px;}
  @media (max-width:480px){
    .hero h1{font-size:32px;}
    .cards-grid{grid-template-columns:repeat(2,1fr);}
    .room-code{font-size:28px; letter-spacing:6px;}
  }

html[data-theme="blue"]{--gold:#4ea5ff;--green:#3c7dc4;--bg-0:#07111f;--bg-1:#0b1d32;--bg-2:#102a46;--card-bg:#10263c;--card-bg-2:#0b1b2d;}
html[data-theme="red"]{--gold:#ff9d5c;--green:#c4453c;--bg-0:#180909;--bg-1:#2a0e0e;--bg-2:#401515;--card-bg:#321616;--card-bg-2:#210d0d;}
html[data-theme="purple"]{--gold:#d7a7ff;--green:#8d5bd6;--bg-0:#10091a;--bg-1:#1b1029;--bg-2:#2b1742;--card-bg:#241534;--card-bg-2:#160c22;}
html[data-theme="orange"]{--gold:#ffb04a;--green:#e8792f;--bg-0:#1a0d05;--bg-1:#2a1509;--bg-2:#43220f;--card-bg:#351a0d;--card-bg-2:#211006;}
html[data-theme="cyan"]{--gold:#67e8f9;--green:#16a6b6;--bg-0:#04151a;--bg-1:#07242b;--bg-2:#0b3640;--card-bg:#0b2b33;--card-bg-2:#061d23;}

html[data-bg="pitch"] body, html[data-bg="worldcup"] body{background:linear-gradient(rgba(3,10,8,.48),rgba(3,10,8,.72)),url("https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=1920&q=85") center/cover fixed;}
html[data-bg="stadium"] body{background:linear-gradient(rgba(3,8,18,.42),rgba(3,8,18,.72)),url("https://images.unsplash.com/photo-1566577739112-5180d4bf9390?auto=format&fit=crop&w=1920&q=85") center/cover fixed;}
html[data-bg="night"] body{background:linear-gradient(rgba(0,0,0,.40),rgba(0,0,0,.72)),url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1920&q=85") center/cover fixed;}

.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.setting-card{background:rgba(255,255,255,.035);border:1px solid rgba(241,237,224,.11);border-radius:14px;padding:14px;}
.setting-card h3{font-size:14px;margin-bottom:9px;}
.setting-note{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.6;}
.setting-actions{display:flex;gap:7px;flex-wrap:wrap;}
.setting-actions button{border:1px solid rgba(241,237,224,.14);background:rgba(0,0,0,.2);color:var(--cream);padding:8px 10px;border-radius:9px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:12px;}
.setting-actions button.active{background:var(--gold);color:#241c05;border-color:var(--gold);}
.setting-card-wide{grid-column:1/-1;}
.bg-actions button,.custom-bg-btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;}
.custom-bg-btn{border:1px dashed rgba(228,183,59,.55);background:rgba(228,183,59,.08);color:var(--cream);padding:8px 11px;border-radius:9px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:800;font-size:12px;}
.custom-bg-btn:hover{background:rgba(228,183,59,.16);transform:translateY(-1px);}
.danger-setting-btn{border-color:rgba(196,69,60,.45)!important;}

.result-message{margin:12px 0;padding:11px 14px;border-radius:12px;background:rgba(196,69,60,.13);border:1px solid rgba(196,69,60,.35);text-align:center;font-weight:800;}
@media(max-width:650px){.settings-grid{grid-template-columns:1fr;}}
.secret-card-wrap{max-width:210px;margin:0 auto 14px;}
.secret-card-wrap .pcard{cursor:default;transform:none;}
.secret-card-wrap .pcard .avatar{width:78px;height:78px;font-size:28px;}

/* Game background presets */
.bg-stadium-realistic{background-image:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.55)),url('https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1920&q=85');background-size:cover;background-position:center;}
.bg-football-night{background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.62)),url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1920&q=85');background-size:cover;background-position:center;}
.bg-landscape{background-image:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.5)),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=85');background-size:cover;background-position:center;}

.seg{flex-wrap:wrap;}

/* ============================= ACCOUNT / AUTH UI ============================= */
.topbar{position:relative;min-height:58px;}
.brand{position:absolute;left:50%;transform:translateX(-50%);top:0;z-index:2;}
.account-box{display:flex;align-items:center;gap:9px;position:absolute;right:0;top:0;z-index:4;cursor:pointer;direction:rtl;}
.account-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--gold),var(--green));border:2px solid rgba(241,237,224,.35);box-shadow:var(--shadow);font-size:20px;overflow:hidden;flex:none;}
.account-avatar img{width:100%;height:100%;object-fit:cover;}
.account-info{display:flex;flex-direction:column;align-items:flex-start;max-width:150px;}
.account-name{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.account-type{font-size:10px;color:var(--muted);}
.account-box:hover .account-avatar{transform:translateY(-1px);}
.auth-gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 15%,#123d29,#06120d 72%);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;}
.auth-panel{width:min(440px,100%);background:linear-gradient(160deg,rgba(18,28,25,.97),rgba(8,14,12,.98));border:1px solid rgba(241,237,224,.14);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.55);text-align:center;}
.auth-logo{font-size:58px;margin-bottom:4px;}
.auth-tabs{display:flex;gap:7px;margin:18px 0;}
.auth-tabs button{flex:1;border:1px solid rgba(241,237,224,.13);background:rgba(255,255,255,.04);color:var(--cream);padding:10px;border-radius:10px;font-family:'Tajawal',sans-serif;font-weight:800;cursor:pointer;}
.auth-tabs button.active{background:var(--gold);color:#241c05;border-color:var(--gold);}
.guest-btn{width:100%;margin-top:9px;border:1px solid rgba(241,237,224,.18);background:rgba(255,255,255,.055);color:var(--cream);padding:11px;border-radius:11px;font-family:'Tajawal',sans-serif;font-weight:900;cursor:pointer;}
.guest-btn:hover{background:rgba(255,255,255,.09);}
.account-settings-card{max-width:620px;margin-inline:auto;}
.avatar-choice-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.avatar-choice{width:42px;height:42px;border-radius:50%;border:1px solid rgba(241,237,224,.16);background:rgba(255,255,255,.05);font-size:21px;cursor:pointer;}
.avatar-choice.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(228,183,59,.2);background:rgba(228,183,59,.12);}
.account-preview{display:flex;align-items:center;gap:12px;margin:4px 0 18px;padding:12px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(241,237,224,.1);}
.account-preview .account-avatar{width:54px;height:54px;font-size:26px;}
@media(max-width:650px){.brand-name{font-size:15px}.brand .crest{width:34px;height:34px}.account-info{display:none}.account-box{right:0}.top-actions{margin-left:0;}.topbar{padding-top:2px;min-height:50px;}.hero{padding-top:22px;}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tgyqqhsqoqplfomzvfuk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nYlh6GeJWsQ1ACb4o14KRA_4IwNbYNm';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let guestMode = localStorage.getItem('guessGuestMode') === '1';
let authMode = 'login';

function avatarForUser(user){ return user?.user_metadata?.avatar || '⚽'; }
function avatarUrlForUser(user){ return user?.user_metadata?.avatarUrl || ''; }
function avatarImageForUser(user){ return user?.user_metadata?.avatarImage || ''; }
function displayNameForUser(user){ return user?.user_metadata?.username || user?.email?.split('@')[0] || 'لاعب'; }
function accountBoxHTML(){
  const name = guestMode && !currentUser ? 'ضيف' : displayNameForUser(currentUser);
  const type = guestMode && !currentUser ? 'وضع الضيف' : 'حسابك';
  const url = guestMode && !currentUser ? '' : avatarUrlForUser(currentUser);
  const image = guestMode && !currentUser ? '' : avatarImageForUser(currentUser);
  const avatar = guestMode && !currentUser ? '👤' : avatarForUser(currentUser);
  const visual = image ? `<img src="${escapeHtmlAttr(image)}" onerror="this.style.display='none';this.parentElement.textContent='${avatar}'">` : (url ? `<img src="${escapeHtmlAttr(url)}" onerror="this.style.display='none';this.parentElement.textContent='${avatar}'">` : avatar);
  return `<div class="account-box" onclick="openAccountArea()" title="الحساب"><div class="account-info"><div class="account-name">${escapeHtml(name)}</div><div class="account-type">${type}</div></div><div class="account-avatar">${visual}</div></div>`;
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function escapeHtmlAttr(v){return escapeHtml(v).replace(/`/g,'&#96;');}
function authGateHTML(){ return `<div class="auth-gate" id="authGate"><div class="auth-panel"><div class="auth-logo">⚽</div><h2>تخمييييين اللاعب</h2><p class="small-muted" style="margin:7px 0 0">سجّل الدخول لحفظ حسابك واللعب أونلاين</p><div class="auth-tabs"><button id="authLoginTab" class="active" onclick="switchAuthMode('login')">تسجيل الدخول</button><button id="authSignupTab" onclick="switchAuthMode('signup')">إنشاء حساب</button></div><div id="authNameWrap" class="field" style="display:none;text-align:right"><label>اسم المستخدم</label><input id="authName" placeholder="مثال: أحمد"></div><div class="field" style="text-align:right"><label>البريد الإلكتروني</label><input id="authEmail" type="email" placeholder="example@email.com"></div><div class="field" style="text-align:right"><label>كلمة المرور</label><input id="authPassword" type="password" placeholder="6 أحرف على الأقل"></div><button class="btn btn-primary btn-block btn-lg" onclick="submitAuth()" id="authSubmit">دخول 🔐</button><button class="guest-btn" onclick="continueAsGuest()">الدخول كضيف 👤</button><p id="authMsg" class="small-muted" style="margin-top:12px;min-height:20px"></p></div></div>`; }
function switchAuthMode(mode){ authMode=mode; const n=document.getElementById('authNameWrap'); if(n)n.style.display=mode==='signup'?'block':'none'; const l=document.getElementById('authLoginTab'),s=document.getElementById('authSignupTab'); if(l)l.classList.toggle('active',mode==='login'); if(s)s.classList.toggle('active',mode==='signup'); const b=document.getElementById('authSubmit'); if(b)b.textContent=mode==='login'?'دخول 🔐':'إنشاء الحساب ✨'; }
async function submitAuth(){ const email=(document.getElementById('authEmail')?.value||'').trim(); const password=document.getElementById('authPassword')?.value||''; const name=(document.getElementById('authName')?.value||'').trim(); const msg=document.getElementById('authMsg'); if(!email||!password){msg.textContent='أدخل البريد الإلكتروني وكلمة المرور.';return;} if(authMode==='signup'&&password.length<6){msg.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.';return;} msg.textContent='جاري المعالجة...'; try{ let result=authMode==='signup'?await supabaseClient.auth.signUp({email,password,options:{data:{username:name||email.split('@')[0],avatar:'⚽',avatarUrl:''}}}):await supabaseClient.auth.signInWithPassword({email,password}); if(result.error)throw result.error; guestMode=false; localStorage.removeItem('guessGuestMode'); currentUser=result.data.user; if(authMode==='signup'&&!result.data.session){msg.textContent='تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.';return;} document.getElementById('authGate')?.remove(); updateAccountUI(); render(); }catch(e){msg.textContent=authErrorArabic(e.message);} }
function authErrorArabic(m){const x=String(m||'');if(/Invalid login credentials/i.test(x))return'البريد الإلكتروني أو كلمة المرور غير صحيحة.';if(/already registered/i.test(x))return'هذا البريد مسجل بالفعل.';if(/Email not confirmed/i.test(x))return'تحقق من بريدك الإلكتروني أولًا.';if(/password/i.test(x)&&/characters/i.test(x))return'كلمة المرور قصيرة جدًا.';return'حدث خطأ: '+x;}
function continueAsGuest(){guestMode=true;currentUser=null;localStorage.setItem('guessGuestMode','1');document.getElementById('authGate')?.remove();updateAccountUI();render();showToast('دخلت كضيف 👤 — الأونلاين يحتاج حسابًا');}
async function logoutUser(){await supabaseClient.auth.signOut();currentUser=null;guestMode=false;localStorage.removeItem('guessGuestMode');location.reload();}
function updateAccountUI(){const el=document.getElementById('accountArea');if(el)el.innerHTML=accountBoxHTML();}
async function initAuth(){ try{const {data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;}catch(e){currentUser=null;} if(!currentUser&&!guestMode)document.body.insertAdjacentHTML('afterbegin',authGateHTML()); updateAccountUI(); supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(currentUser){guestMode=false;localStorage.removeItem('guessGuestMode');document.getElementById('authGate')?.remove();} updateAccountUI();}); }

function normalizeArabic(s){
  return (s||'')
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[أإآ]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/ى/g,'ي')
    .replace(/\s+/g,' ')
    .trim();
}

    'مغربي':'المغرب','مغربيه':'المغرب','مصري':'مصر','مصريه':'مصر','جزائري':'الجزائر','جزائريه':'الجزائر','سعودي':'السعودية','سعوديه':'السعودية','كندي':'كندا','اسكتلندي':'اسكتلندا','صربي':'صربيا','اوروغوياني':'أوروغواي','إكوادوري':'الإكوادور','كوري جنوبي':'كوريا الجنوبية','من كوت ديفوار':'كوت ديفوار'
  };
  for(const [kw,nat] of Object.entries(nationalityAliases)){
    if(has(kw) && (hasAny('جنسي','جنسية','الجنسية','اصله','أصله','من'))) return yes(secret.nat===nat);
  }
  // Explicit country names even when the user omits the word "جنسية".
  for(const nat of [...new Set(PLAYERS.map(p=>p.nat))].sort((a,b)=>b.length-a.length)) if(has(nat)) return yes(secret.nat===nat);

  // ---- Status / physical profile / nationality / continent ----
  if(hasAny('اساسي','اساسي دائما','يلعب كثيرا','تشكيله الاساسيه','ضمن التشكيله الاساسيه')) return yes(secret.starter);
  if(hasAny('اعتزل','معتزل','لاعب معتزل')) return yes(secret.team==='معتزل');
  if(hasAny('بدون نادي','بدون ناد','حر حاليا','لا يملك نادي')) return yes(secret.team==='بدون نادٍ');
  if(hasAny('طويل','طوله')) { const m=t.match(/(?:طول|طويل).*?(\d{3})/); return m ? yes(secret.height>=parseInt(m[1])) : yes(secret.height>=185); }
  if(hasAny('قصير')) return yes(secret.height<180);
  if(hasAny('قوي جسديا','قوي بدنيا','قوه بدنيه','بنيه قويه','قوي')) return yes(secret.height>=185 || ['أنطونيو روديغر','إيرلينغ هالاند','فيرجيل فان دايك','مانويل نوير'].includes(secret.name));
  if(hasAny('اوروبي','اوروبا')) return yes(CONTINENT_OF[secret.nat]==='أوروبا');
  if(hasAny('افريقي','افريقيا')) return yes(CONTINENT_OF[secret.nat]==='أفريقيا');
  if(hasAny('اسيوي','اسيا')) return yes(CONTINENT_OF[secret.nat]==='آسيا');
  if(hasAny('امريكا الجنوبيه','لاتيني')) return yes(CONTINENT_OF[secret.nat]==='أمريكا الجنوبية');
  if(hasAny('امريكا الشماليه','امريكا الشمالية')) return yes(CONTINENT_OF[secret.nat]==='أمريكا الشمالية');
  if(hasAny('عربي','عرب')) return yes(ARAB_COUNTRIES.includes(secret.nat));
  for(const nat of [...new Set(PLAYERS.map(p=>p.nat))]) if(has(nat)) return yes(secret.nat===nat);

  // ---- Left/right foot (data-light but deterministic for current database) ----
  const leftFoot = ['ليونيل ميسي','محمد صلاح','نيمار','بيدري','بوكايو ساكا','مارتن أوديغارد'];
  if(hasAny('بالقدم اليسرى','باليسار','يساري','اعسر','اعسر القدم','قدم يسرى')) return yes(leftFoot.includes(secret.name));
  if(hasAny('بالقدم اليمنى','باليمين','يميني','ايمن القدم','قدم يمنى')) return yes(!leftFoot.includes(secret.name));

  return {matched:false, answer:null};
}

const AI_DIFF = {
  easy:  {minQuestions:2, guessThreshold:1, guessEagerness:0.04, delay:[900,1600]},
  medium:{minQuestions:3, guessThreshold:1, guessEagerness:0.12, delay:[1100,1900]},
  hard:  {minQuestions:4, guessThreshold:1, guessEagerness:0.28, delay:[1300,2200]},
};

function aiAttr(key){ return AI_ATTRS.find(a=>a.key===key); }
function aiValue(attr,p){ return attr.getVal(p); }
function aiQuestionSignature(key,val){ return key+'|'+String(val); }

/*
  IMPORTANT: the candidate set is the AI's entire public knowledge base.
  Every answer is a permanent constraint until the round ends.  Wrong guesses
  are also constraints.  The AI never consults the human's five cards here.
*/
function aiBeliefCircle(){
  let circle=PLAYERS.filter(p=>!local.wrongB.includes(p.id));
  for(const e of (local.qlogB||[])){
    const attr=aiAttr(e.key);
    if(!attr) continue;
    circle=circle.filter(p=>(aiValue(attr,p)===e.val)===!!e.answer);
  }
  return circle;
}

function aiKnownValue(key){
  const entries=(local.qlogB||[]).filter(e=>e && e.key===key);
  return entries.length ? entries[entries.length-1] : null;
}

/* Only propose a value that actually exists in the CURRENT circle.  This is
   what prevents "Spain -> Germany" jumps. If the circle is entirely Spain,
   Germany literally cannot become a question. */
function aiQuestionOptions(attr,candidates){
  const values=[];
  const seen=new Set();
  for(const p of candidates){
    const v=aiValue(attr,p);
    const k=String(v);
    if(!seen.has(k)){ seen.add(k); values.push(v); }
  }
  return values;
}

function aiQuestionScore(attr,candidates,askedSet){
  const n=candidates.length;
  if(n<2) return null;

  /* If we already know the exact value of an attribute, don't ask the same
     attribute in a different form.  The exception is club: after learning a
     league, individual clubs inside that league are precisely the useful
     follow-up questions. */
  const known=aiKnownValue(attr.key);
  const options=aiQuestionOptions(attr,candidates);
  if(options.length<2) return null;

  let best=null;
  for(const val of options){
    const sig=aiQuestionSignature(attr.key,val);
    if(askedSet.has(sig)) continue;

    const yes=candidates.reduce((n,p)=>n+(aiValue(attr,p)===val?1:0),0);
    const no=n-yes;
    if(yes===0 || no===0) continue;

    const ratio=yes/n;
    const entropy=-(ratio*Math.log2(ratio)+(1-ratio)*Math.log2(1-ratio));
    let score=entropy;

    /* CONTEXTUAL PRIORITIES: once a league is known, ask about clubs in that
       league before wandering to another league. Once a club is known, don't
       ask about other clubs. */
    if(attr.key==='club'){
      if(known && known.answer && known.val===val) continue;
      score += n<=25 ? 0.22 : n<=50 ? 0.10 : -0.02;
      /* If we know the league, clubs in that league become the natural next
         layer of questions. We never use a club from outside the survivors. */
      const knownLeague=(local.qlogB||[]).find(e=>e && e.key==='league' && e.answer);
      if(knownLeague) {
        const inKnownLeague=candidates.filter(p=>p.league===knownLeague.val);
        if(inKnownLeague.length===candidates.length) score += 0.65;
        else score += 0.30;
      }
    }
    if(attr.key==='league'){
      /* LOCATION FIRST: league is a major narrowing signal. When the AI does
         not know the current league yet, strongly prefer a league question.
         Once a league is known, stop asking league questions and move to clubs
         inside that league. */
      score += 0.42;
      if(known) continue;
      if(n<=60) score += 0.16;
      if(n<=25) score += 0.08;
    }
    if(attr.key==='position') score += 0.10;
    if(attr.key==='nationality') score += 0.06;
    if(attr.key==='continent') score += 0.01;
    if(attr.key==='top5') score += 0.02;
    if(['ucl_winner','worldcup','ballondor','thebest','goldenboy','yashin','goldenboot'].includes(attr.key)) score += n<=35?0.10:0.02;
    if(attr.key==='height185') score -= 0.05;
    if(attr.key==='starter') score -= 0.03;

    if(!best || score>best.score) best={attr,val,yes,no,score};
  }
  return best;
}

function aiChooseQuestion(candidates, askedQuestions){
  if(!candidates || candidates.length<2) return null;
  const askedSet=new Set(askedQuestions||[]);
  const scored=[];
  for(const attr of AI_ATTRS){
    const q=aiQuestionScore(attr,candidates,askedSet);
    if(q) scored.push(q);
  }
  if(!scored.length) return null;
  scored.sort((a,b)=>b.score-a.score);

  const diff=local?.aiDifficulty||'easy';
  /* Difficulty changes only how much we deviate from the best useful question.
     It never allows a question whose value is absent from the current circle. */
  let pick=scored[0];
  if(diff==='easy' && scored.length>2) pick=scored[Math.min(2,scored.length-1)];
  else if(diff==='medium' && scored.length>1) pick=scored[1];

  return {
    key:pick.attr.key,
    val:pick.val,
    text:pick.attr.question(pick.val),
    expectedYes:pick.yes,
    expectedNo:pick.no,
    remainingIfYes:pick.yes,
    remainingIfNo:pick.no
  };
}

function aiDecideAndAsk(){
  const cfg=AI_DIFF[local.aiDifficulty||'easy'];
  let candidates=aiBeliefCircle();
  local.aiCircleIds=candidates.map(p=>p.id);
  local.aiCircleSize=candidates.length;

  /* Never manufacture a candidate. If answers conflict with the database,
     stop rather than silently forgetting evidence. */
  if(candidates.length===0){
    local.pendingAiQuestion=null;
    local.turn=0;
    showToast('🤖 لا توجد احتمالات توافق كل إجاباتك. يبدو أن هناك إجابة متناقضة.');
    goToAsk();
    return;
  }

  const asked=local.qlogB.length;
  const diff=local.aiDifficulty||'easy';
  const guessSize=diff==='hard'?2:diff==='medium'?2:1;

  /* Guess ONLY from the current circle. More questions are always allowed. */
  if(candidates.length===1 && asked>=cfg.minQuestions){
    submitGuessByIdx(1,candidates[0].id);
    return;
  }

  if(candidates.length<=guessSize && asked>=cfg.minQuestions+2){
    /* choose a survivor deterministically from the evidence, not randomly */
    const pick=candidates[0];
    submitGuessByIdx(1,pick.id);
    return;
  }

  const decision=aiChooseQuestion(candidates,local.askedCatB);
  if(!decision){
    /* No remaining binary distinction: the survivors are genuinely
       indistinguishable using the stored attributes. Guess only a survivor. */
    submitGuessByIdx(1,candidates[0].id);
    return;
  }

  local.askedCatB.push(aiQuestionSignature(decision.key,decision.val));
  local.pendingAiQuestion=decision;
  screen='local_answer_human';
  render();
}

function aiDifficultyOf(p){
  if(AI_EASY_TEAMS.includes(p.team)) return 'easy';
  if(AI_HARD_LEAGUES.includes(p.league)) return 'hard';
  if(AI_MEDIUM_TEAMS.includes(p.team)) return 'medium';
  return TOP5_LEAGUES.includes(p.league) ? 'medium' : 'hard';
}
function aiSecretPool(diff){ return PLAYERS.filter(p=>aiDifficultyOf(p)===diff); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickFive(usedIds){
  let pool = PLAYERS.filter(p=>!usedIds.includes(p.id));
  if(pool.length < 5){ usedIds.length = 0; pool = PLAYERS.slice(); }
  const chosen = shuffle(pool).slice(0,5);
  chosen.forEach(c=>usedIds.push(c.id));
  return chosen;
}

  };
}
function beginLocalRound(){
  local.cardsA = pickFive(local.usedIds);
  local.cardsB = pickFive(local.usedIds);
  local.secretA = null; local.secretB = null;

        let aiCards = local.cardsB.filter(c=>targetPool.some(p=>p.id===c.id));
        let aiCard;
        if(aiCards.length){
          aiCard = aiCards[Math.floor(Math.random()*aiCards.length)];
        } else {
          aiCard = targetPool[Math.floor(Math.random()*targetPool.length)] || local.cardsB[Math.floor(Math.random()*local.cardsB.length)];
          const replaceAt=Math.floor(Math.random()*local.cardsB.length);
          local.cardsB[replaceAt]=aiCard;
        }
        local.secretB = aiCard.id;
        screen = 'local_guess_ready';
      } else {

    } else {
      screen = 'local_guess_ready';

    render();

function submitGuessByIdx(actorIdx, playerId){
  const wrongArr = actorIdx===0 ? local.wrongA : local.wrongB;
  const qlog = actorIdx===0 ? local.qlogA : local.qlogB;
  const secretTargetId = actorIdx===0 ? local.secretB : local.secretA;
  const guessedPlayer = PLAYERS.find(p=>p.id===playerId);
  if(!guessedPlayer) return;

  if(wrongArr.includes(playerId)){ showToast('جربت هذا الاسم من قبل، اختر غيره'); return; }

  if(playerId === secretTargetId){
    const attempts = qlog.length + wrongArr.length + 1;
    const points = local.matchStyle === 'performance' ? Math.max(20, 100 - (qlog.length * 10)) : 1;
    local.scores[actorIdx] += points;
    local.lastWinnerIdx = actorIdx;
    local.lastPoints = points;
    local.lastTries = qlog.length + wrongArr.length + 1;
    screen = 'local_result';
    render();
  } else {
    wrongArr.push(playerId);
    local.turn = actorIdx===0 ? 1 : 0;
    local.lastWrongGuessName = guessedPlayer.name;
    showToast(`❌ ليس هو ${guessedPlayer.name} — انتقل الدور إلى اللاعب الآخر`);
    goToAsk();
  }
}

function scheduleAiTurn(){
  if(aiTimer) return;
  const cfg = AI_DIFF[local.aiDifficulty||'easy'];
  const [minD,maxD] = cfg.delay;
  aiTimer = setTimeout(()=>{
    aiTimer = null;
    if(!(screen==='local_ai_thinking' && local && local.vsAI && local.turn===1)) return;
    aiDecideAndAsk();
  }, minD + Math.random()*(maxD-minD));
}
function aiDecideAndAsk(){
  const cfg=AI_DIFF[local.aiDifficulty||'easy'];

  // STEP 1: start from all players in the app.
  // STEP 2: apply EVERY previous answer as a hard YES/NO filter.
  // STEP 3: only then choose the next question from the survivors.
  // STEP 4: only when the survivor circle is small, make evidence-based guesses.
  let candidates=aiBeliefCircle();
  local.aiCircleIds=candidates.map(p=>p.id);
  local.aiCircleSize=candidates.length;

  // If the database and the user's answers create an impossible state, do not
  // invent a player or secretly consult the target. Remove only the latest
  // constraint and continue from the last coherent state.
  if(candidates.length===0 && local.qlogB.length){
    const last=local.qlogB.pop();
    candidates=aiBeliefCircle();
    local.aiCircleIds=candidates.map(p=>p.id);
    local.aiCircleSize=candidates.length;
    showToast('🤖 حصل تعارض في المعلومات، سأعيد التفكير من الإجابات السابقة.');
  }

  // The AI does NOT know which survivor is the secret. It waits until the
  // circle is genuinely small, then guesses among the survivors.
  const asked=local.qlogB.length;
  const diff=local.aiDifficulty||'easy';
  const guessSize=diff==='hard'?3:diff==='medium'?2:2;
  const minBeforeGuess=cfg.minQuestions;

  if(candidates.length===1 && asked>=minBeforeGuess){
    // One surviving hypothesis: this is a logical conclusion, not a cheat.
    submitGuessByIdx(1,candidates[0].id);
    return;
  }

  if(candidates.length<=guessSize && asked>=minBeforeGuess+1){
    // No knowledge of the secret: choose only from the remaining hypotheses.
    // A wrong guess is added to wrongB, so the next turn shrinks the circle.
    const available=candidates.filter(p=>!local.wrongB.includes(p.id));
    if(available.length){
      const pick=available[Math.floor(Math.random()*available.length)];
      submitGuessByIdx(1,pick.id);
      return;
    }
  }

  // Pick the most informative question for the CURRENT circle.
  const decision=aiChooseQuestion(candidates,local.askedCatB);
  if(!decision){
    // No unused binary distinction remains. Guess from the circle only.
    if(candidates.length){
      const pick=candidates[Math.floor(Math.random()*candidates.length)];
      submitGuessByIdx(1,pick.id);
      return;
    }
    local.turn=0;
    goToAsk();
    return;
  }

  local.askedCatB.push(aiQuestionSignature(decision.key,decision.val));
  local.pendingAiQuestion=decision;
  screen='local_answer_human';
  render();
}

  const humanName = local.names[0];
  return `

function answerAiQuestion(bool){
  if(!local || !local.pendingAiQuestion) return;
  const q={...local.pendingAiQuestion};
  local.aiAnswerHistory.push({question:q, answer:bool});
  local.qlogB.push({...q, answer:bool});

function undoAiLastAnswer(){
  if(!local || !local.vsAI || !local.aiAnswerHistory.length) return;
  const h=local.aiAnswerHistory.pop();
  if(local.qlogB.length) local.qlogB.pop();
  const sig=aiQuestionSignature(h.question.key,h.question.val);
  const i=local.askedCatB.lastIndexOf(sig);
  if(i>=0) local.askedCatB.splice(i,1);
  local.pendingAiQuestion={...h.question};
  local.turn=1;
  screen='local_answer_human';
  render();
  showToast('↶ تم التراجع عن إجابة الذكاء الاصطناعي. اختر الإجابة الصحيحة.');
}

/* ============================= ONLINE: STORAGE HELPERS ============================= */
async function readKey(key){ try{ const res = await window.storage.get(key, true); return res ? JSON.parse(res.value) : null; }catch(e){ return null; } }
async function writeKey(key, obj){ try{ await window.storage.set(key, JSON.stringify(obj), true); return true; }catch(e){ return false; } }
async function deleteKey(key){ try{ await window.storage.delete(key, true); }catch(e){} }
async function readRoom(code){ return readKey('room:'+code); }
async function writeRoom(code, roomObj){ return writeKey('room:'+code, roomObj); }

function freshRoomShape(code, totalRounds, hostName){
  const usedIds = [];
  return {
    code, totalRounds, round:1,
    players:{ host:{name:hostName}, guest:null },
    status:'waiting', starterRole:'host', turn:'host', phase:'lobby', qaState:'ask',
    usedIds,
    cardsHost:null, cardsGuest:null,
    secretHost:null, secretGuest:null,
    qlogHost:[], qlogGuest:[], wrongHost:[], wrongGuest:[],
    pendingQuestion:null,
    scores:{host:0, guest:0},
    lastWinnerRole:null, lastPoints:0, lastTries:0,
    updatedAt: Date.now(),
  };
}
function beginOnlineRoundFields(room){
  room.cardsHost = pickFive(room.usedIds).map(p=>p.id);
  room.cardsGuest = pickFive(room.usedIds).map(p=>p.id);
  room.secretHost = null; room.secretGuest = null;
  room.qlogHost = []; room.qlogGuest = []; room.wrongHost = []; room.wrongGuest = [];
  room.pendingQuestion = null;
  room.qaState = 'ask';
  room.phase = 'picking';
}

/* ---- manual create/join ---- */
async function createOnlineRoom(){
  const name = $('#hostName').value.trim() || 'المضيف';
  const rounds = (online && online.rounds) || 3;
  const code = roomCode();
  const room = freshRoomShape(code, rounds, name);
  const ok = await writeRoom(code, room);
  if(!ok){ showToast('تعذر إنشاء الغرفة، تحقق من الاتصال'); return; }
  online = { code, myRole:'host', room };
  screen = 'online_room';
  render();
  startPolling();
}
async function joinOnlineRoom(){
  const name = $('#guestName').value.trim() || 'الضيف';
  const code = $('#joinCode').value.trim().toUpperCase();
  if(!code){ showToast('أدخل كود الغرفة'); return; }
  const room = await readRoom(code);
  if(!room){ showToast('لم يتم العثور على الغرفة، تحقق من الكود'); return; }
  if(room.players.guest){ showToast('الغرفة ممتلئة بالفعل'); return; }
  room.players.guest = {name};
  room.status = 'playing';
  beginOnlineRoundFields(room);
  room.updatedAt = Date.now();
  const ok = await writeRoom(code, room);
  if(!ok){ showToast('تعذر الانضمام، حاول مجددًا'); return; }
  online = { code, myRole:'guest', room };
  screen = 'online_room';
  render();
  startPolling();
}

/* ---- matchmaking ---- */
async function startMatchmaking(){
  const name = $('#onlineName').value.trim() || 'لاعب';
  const rounds = (online && online.rounds) || 3;
  const myId = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  online = { myId, name, rounds, searching:true };
  screen = 'online_matchmaking';
  render();
  await matchmakingTick();
  mmHandle = setInterval(matchmakingTick, 1600);
}
function stopMatchmaking(){ if(mmHandle){ clearInterval(mmHandle); mmHandle=null; } }
async function cancelMatchmaking(){
  stopMatchmaking();
  if(online && online.myId){
    let q = await readKey('mm_queue') || [];
    q = q.filter(e=>e.id!==online.myId);
    await writeKey('mm_queue', q);
    await deleteKey('mm_assign:'+online.myId);
  }
  online = null; screen = 'online_matchmaking_setup'; render();
}
async function matchmakingTick(){
  if(!online || !online.searching) return;
  const myId = online.myId;
  const assign = await readKey('mm_assign:'+myId);
  if(assign && assign.code){
    stopMatchmaking();
    await deleteKey('mm_assign:'+myId);
    const room = await readRoom(assign.code);
    if(room){
      online = { code:assign.code, myRole:'host', room, searching:false };
      screen = 'online_room'; render(); startPolling();
      return;
    }
  }
  let queue = await readKey('mm_queue') || [];
  const now = Date.now();
  queue = queue.filter(e => now - e.joinedAt < 60000);
  const others = queue.filter(e=>e.id!==myId);
  if(others.length>0){
    others.sort((a,b)=>a.joinedAt-b.joinedAt);
    const opponent = others[0];
    const rest = queue.filter(e=>e.id!==myId && e.id!==opponent.id);
    await writeKey('mm_queue', rest);
    const code = roomCode();
    const room = freshRoomShape(code, opponent.rounds || online.rounds || 3, opponent.name);
    room.players.guest = {name: online.name};
    room.status = 'playing';
    beginOnlineRoundFields(room);
    room.updatedAt = Date.now();
    await writeRoom(code, room);
    await writeKey('mm_assign:'+opponent.id, {code});
    stopMatchmaking();
    online = { code, myRole:'guest', room, searching:false };
    screen = 'online_room'; render(); startPolling();
    return;
  }
  const already = queue.find(e=>e.id===myId);
  if(!already) queue.push({id:myId, name:online.name, rounds:online.rounds||3, joinedAt: now});
  await writeKey('mm_queue', queue);
  if(screen==='online_matchmaking') render();
}
function renderMatchmaking(){
  return `
  <div class="screen center"><div class="panel">
    <div class="radar"></div>
    <h2>جاري البحث عن خصم</h2>
    <p class="small-muted mt">سيتم مطابقتك تلقائيًا بمجرد توفر لاعب آخر يبحث عن مباراة.</p>
    <button class="btn btn-ghost mt" onclick="cancelMatchmaking()">إلغاء البحث</button>
  </div></div>`;
}

/* ============================= ONLINE ROOM ============================= */
function startPolling(){ stopPolling(); pollHandle = setInterval(pollRoom, 1500); }
function stopPolling(){ if(pollHandle){ clearInterval(pollHandle); pollHandle=null; } }
async function pollRoom(){
  if(!online || !online.code) return;
  const room = await readRoom(online.code);
  if(!room) return;
  if(!online.room || room.updatedAt !== online.room.updatedAt){
    online.room = room;
    if(screen==='online_room') render();
  }
}
function idsToPlayers(ids){ return (ids||[]).map(id=>PLAYERS.find(p=>p.id===id)); }

function renderOnlineRoom(){
  const room = online.room;
  const myRole = online.myRole;
  const oppRole = myRole==='host' ? 'guest' : 'host';
  const myName = room.players[myRole]?.name || 'أنت';
  const oppName = room.players[oppRole]?.name || 'الخصم';

  if(room.status==='waiting'){
    return `
    <div class="screen center"><div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">شارك هذا الكود مع صديقك</div>
      <div class="room-code">${room.code}</div>
      <div class="copy-row"><button class="btn btn-ghost" onclick="copyCode()">📋 نسخ الكود</button></div>
      <p class="small-muted mt">بانتظار انضمام الطرف الآخر...</p>
    </div></div>`;
  }

  if(room.phase==='finished') return renderOnlineFinal(room);

  if(room.phase==='picking'){
    const mySecret = myRole==='host' ? room.secretHost : room.secretGuest;
    const myCards = idsToPlayers(myRole==='host' ? room.cardsHost : room.cardsGuest);
    if(mySecret!==null && mySecret!==undefined){
      return `
      <div class="screen center">
        ${scoreboardHTML([myName,oppName],[room.scores[myRole],room.scores[oppRole]], room.round, room.totalRounds, null)}
        <div class="panel"><div class="pass-icon">✅</div><h2>تم اختيار بطاقتك السرية</h2><p class="small-muted mt">بانتظار اختيار ${oppName} لبطاقته...</p></div>
      </div>`;
    }
    return `
    <div class="screen">
      ${scoreboardHTML([myName,oppName],[room.scores[myRole],room.scores[oppRole]], room.round, room.totalRounds, null)}
      <div class="center" style="margin-bottom:10px;"><h2>اختر بطاقتك السرية 🤫</h2><p class="small-muted">${oppName} لن يرى هذه البطاقات إطلاقًا</p></div>
      <div class="cards-grid">${myCards.map(p=>cardHTML(p,{onClick:`onlinePick(${p.id})`})).join('')}</div>
    </div>`;
  }

  if(room.phase==='guessing'){
    const actorRole = room.turn;
    const actorName = actorRole===myRole ? myName : oppName;
    const targetRole = actorRole==='host' ? 'guest' : 'host';
    const targetName = targetRole===myRole ? myName : oppName;
    const qlog = actorRole==='host' ? room.qlogHost : room.qlogGuest;
    const wrongArr = actorRole==='host' ? room.wrongHost : room.wrongGuest;
    const potential = costOf(qlog.length, wrongArr.length);
    const logHTML = qlog.length
      ? `<div class="qa-log">${qlog.map(e=>`<div class="qa-entry">${e.text} ← <b>${e.answer?'نعم':'لا'}</b></div>`).join('')}</div>`
      : `<p class="small-muted" style="margin-bottom:14px;">لا توجد أسئلة بعد.</p>`;
    const wrongHTML = wrongArr.length ? `<div class="wrong-chips">${wrongArr.map(id=>`<span class="wrong-chip">✕ ${PLAYERS.find(p=>p.id===id)?.name}</span>`).join('')}</div>` : '';

    if(room.qaState==='awaiting_answer'){
      const isTarget = targetRole===myRole;
      if(isTarget){
        return `
        <div class="screen">
          ${scoreboardHTML([room.players.host.name, room.players.guest.name],[room.scores.host, room.scores.guest], room.round, room.totalRounds, actorName)}
          <div class="center"><p class="small-muted">${myName}، أجب بصدق عن بطاقتك السرية:</p></div>
          <div class="question-bubble">${room.pendingQuestion}</div>
          <div class="answer-buttons">
            <button class="yesno-btn yesno-yes" onclick="onlineAnswer(true)">نعم ✅</button>
            <button class="yesno-btn yesno-no" onclick="onlineAnswer(false)">لا ❌</button>
          </div>
        </div>`;
      }
      return `
      <div class="screen">
        ${scoreboardHTML([room.players.host.name, room.players.guest.name],[room.scores.host, room.scores.guest], room.round, room.totalRounds, actorName)}
        <div class="waiting-block panel"><p class="small-muted">⏳ بانتظار إجابة ${targetName}...</p></div>
      </div>`;
    }

    if(actorRole!==myRole){
      return `
      <div class="screen">
        ${scoreboardHTML([room.players.host.name, room.players.guest.name],[room.scores.host, room.scores.guest], room.round, room.totalRounds, actorName)}
        <div class="waiting-block panel"><p class="small-muted">⏳ دور ${actorName} الآن...</p></div>
      </div>`;
    }

    return `
    <div class="screen">
      ${scoreboardHTML([room.players.host.name, room.players.guest.name],[room.scores.host, room.scores.guest], room.round, room.totalRounds, actorName)}
      <div class="center" style="margin-bottom:10px;"><p>🎯 دورك — اسأل عن بطاقة <b>${targetName}</b> السرية بأي سؤال بنعم/لا، أو خمّن الاسم مباشرة</p></div>
      <div class="qa-wrap">
        <div class="qa-title"><h3 style="font-size:16px;">سجل الأسئلة</h3><span class="qa-potential">النقاط عند التخمين الآن: ${potential}</span></div>
        ${logHTML}
        <div class="guess-row">
          <input id="questionInputOnline" placeholder="مثال: هل هو مهاجم؟" maxlength="120">
          <button class="btn btn-hint" onclick="onlineSubmitQuestion()">اسأل ❓</button>
        </div>
        <div class="guess-row" style="margin-top:10px;">
          <input id="guessInputOnline" list="allPlayersList" placeholder="أو اكتب اسم اللاعب مباشرة للتخمين...">
          <button class="btn btn-primary" onclick="onlineSubmitGuessFromInput()">تخمين ✅</button>
        </div>
        ${datalistHTML('allPlayersList')}
        ${wrongHTML}
      </div>
    </div>`;
  }

  if(room.phase==='result'){
    const winnerRole = room.lastWinnerRole;
    const winnerName = room.players[winnerRole]?.name;
    const loserRole = winnerRole==='host' ? 'guest' : 'host';
    const secretIdx = loserRole==='host' ? room.secretHost : room.secretGuest;
    const secretPlayer = PLAYERS.find(p=>p.id===secretIdx);
    const isFinalRound = room.round >= room.totalRounds;
    return `
    <div class="screen">
      ${scoreboardHTML([room.players.host.name, room.players.guest.name],[room.scores.host, room.scores.guest], room.round, room.totalRounds, null)}
      <div class="result-banner win"><h2>🏆 ${winnerName} خمّن بشكل صحيح!</h2><div class="points">+${room.lastPoints} نقطة · بعد ${room.lastTries} محاولة/محاولات</div></div>
      <div class="center small-muted" style="margin-bottom:8px;">البطاقة السرية كانت:</div>
      <div class="cards-grid">${cardHTML(secretPlayer,{correct:true, disabled:true})}</div>
      <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary btn-lg" onclick="onlineNextRound()">${isFinalRound ? 'عرض النتيجة النهائية 🏁' : 'الجولة التالية ⏭'}</button></div>
    </div>`;
  }
  return `<div class="screen center"><p>...</p></div>`;
}

async function onlinePick(playerId){
  const room = await readRoom(online.code);
  if(!room) return;
  if(online.myRole==='host') room.secretHost = playerId; else room.secretGuest = playerId;
  if(room.secretHost!==null && room.secretHost!==undefined && room.secretGuest!==null && room.secretGuest!==undefined){
    room.phase = 'guessing';
    room.turn = room.starterRole;
    room.qaState = 'ask';
  }
  room.updatedAt = Date.now();
  await writeRoom(online.code, room);
  online.room = room; render();
}

async function onlineSubmitQuestion(){
  const input = $('#questionInputOnline');
  const text = (input ? input.value : '').trim();
  if(!text){ showToast('اكتب سؤالًا أولاً'); return; }
  const room = await readRoom(online.code);
  if(!room) return;
  if(room.turn !== online.myRole || room.qaState!=='ask') return;
  room.pendingQuestion = text;
  room.qaState = 'awaiting_answer';
  room.updatedAt = Date.now();
  await writeRoom(online.code, room);
  online.room = room; render();
}
async function onlineAnswer(bool){
  const room = await readRoom(online.code);
  if(!room) return;
  const actorRole = room.turn;
  const qlogField = actorRole==='host' ? 'qlogHost' : 'qlogGuest';
  room[qlogField].push({text: room.pendingQuestion, answer: bool});
  room.pendingQuestion = null;
  room.turn = actorRole==='host' ? 'guest' : 'host';
  room.qaState = 'ask';
  room.updatedAt = Date.now();
  await writeRoom(online.code, room);
  online.room = room; render();
}
function onlineSubmitGuessFromInput(){
  const input = $('#guessInputOnline');
  const player = findPlayerByName(input ? input.value : '');
  if(!player){ showToast('اختر اسمًا صحيحًا من القائمة'); return; }
  onlineSubmitGuess(player.id);
}
async function onlineSubmitGuess(playerId){
  const room = await readRoom(online.code);
  if(!room) return;
  const actorRole = room.turn;
  if(actorRole !== online.myRole || room.qaState!=='ask') return;
  const targetRole = actorRole==='host' ? 'guest' : 'host';
  const wrongArr = actorRole==='host' ? room.wrongHost : room.wrongGuest;
  const qlog = actorRole==='host' ? room.qlogHost : room.qlogGuest;
  const secretTargetId = targetRole==='host' ? room.secretHost : room.secretGuest;

  if(wrongArr.includes(playerId)){ showToast('جربت هذا الاسم من قبل، اختر غيره'); return; }

  if(playerId === secretTargetId){
    const points = 1;
    room.scores[actorRole] += points;
    room.lastWinnerRole = actorRole;
    room.lastPoints = points;
    room.lastTries = qlog.length + wrongArr.length + 1;
    room.phase = 'result';
  } else {
    wrongArr.push(playerId);
    room.turn = actorRole==='host' ? 'guest' : 'host';
  }
  room.updatedAt = Date.now();
  await writeRoom(online.code, room);
  online.room = room; render();
}
async function onlineNextRound(){
  const room = await readRoom(online.code);
  if(!room) return;
  if(room.round >= room.totalRounds){
    room.phase = 'finished';
    room.updatedAt = Date.now();
    await writeRoom(online.code, room);
    online.room = room; render();
    return;
  }
  room.round++;
  room.starterRole = room.starterRole==='host' ? 'guest' : 'host';
  room.turn = room.starterRole;
  beginOnlineRoundFields(room);
  room.updatedAt = Date.now();
  await writeRoom(online.code, room);
  online.room = room; render();
}
function renderOnlineFinal(room){
  const hs = room.scores.host, gs = room.scores.guest;
  let resultText = hs===gs ? 'تعادل مثير! 🤝' : `🏆 ${hs>gs?room.players.host.name:room.players.guest.name} يفوز بالمباراة!`;
  return `
  <div class="screen center">
    <h1 style="font-size:28px; margin-bottom:6px;">${resultText}</h1>
    <div class="final-podium">
      <div class="podium-card"><div class="trophy">${hs>=gs?'🥇':'🥈'}</div><div class="pname">${room.players.host.name}</div><div class="pscore">${hs}</div></div>
      <div class="podium-card"><div class="trophy">${gs>=hs?'🥇':'🥈'}</div><div class="pname">${room.players.guest.name}</div><div class="pscore">${gs}</div></div>
    </div>
    <div class="btn-row" style="justify-content:center;"><button class="btn btn-ghost btn-lg" onclick="goHome()">🏠 الرئيسية</button></div>
  </div>`;
}
function copyCode(){
  if(!online) return;
  const text = online.code;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('تم نسخ الكود ✅')).catch(()=>showToast(text));
  } else { showToast(text); }
}

/* ============================= INIT ============================= */
render();
initAuth();
</script>
